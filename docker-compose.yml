name: asherons-call

services:
  ace-db:
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: ace-db
    env_file:
      - docker.env
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - "3306:3306/tcp"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ace-production
    stop_grace_period: 1m

  ace-server:
    image: acemulator/ace@sha256:a4e54ddeddca0e46ea9334c3b93589214b2723c7043c6d6a788c5c4d35ab7d9b
    depends_on:
      ace-db:
        condition: service_healthy
    container_name: ace-server
    env_file:
      - docker.env
    volumes:
      - ./Config:/ace/Config
      - ./Content:/ace/Content
      - ./Dats:/ace/Dats
      - ./Logs:/ace/Logs
      - ./Mods:/ace/Mods
    ports:
      - "9000-9001:9000-9001/udp"
    stdin_open: true
    tty: true
    networks:
      - ace-production
    stop_grace_period: 2m

networks:
  ace-production:
    name: ace-production
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.105.0/24
          gateway: 10.77.105.1
